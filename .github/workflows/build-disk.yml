---
# Project Orbis – Installer-ISO aus dem Container-Image erzeugen (bootc-image-builder).
# Abgeleitet von ublue-os/image-template (Apache-2.0), siehe NOTICE.
#
# Läuft NUR manuell und setzt voraus, dass "Build container image" schon erfolgreich lief,
# denn die ISO wird aus dem Image in der GHCR gebaut. Die ISO ist mehrere GB gross.
# Voraussetzung: Das Image in der GHCR ist erreichbar (siehe docs/adr/0006-image-build-und-hosting.md).
name: Build disk images

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}  # Ergebnis von build.yml, synchron halten
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # nicht ändern
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Image-Adresse klein schreiben
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Nötig, falls das Image noch privat ist (ungetestet, siehe ADR 0006)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          # btrfs wie lokal im Justfile und bei Bazzite üblich
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Upload ISO and checksum to job artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbis-installer-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          # kurz halten, damit nicht unnötig Speicher belegt wird
          retention-days: 3
          compression-level: 0
          overwrite: true
